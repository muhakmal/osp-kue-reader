name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :kue-reader:testDebugUnitTest --stacktrace

      - name: Build SDK AAR and Sample APK
        run: ./gradlew :kue-reader:assembleRelease :sample:assembleDebug --stacktrace

      - name: Upload SDK AAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kue-reader-aar
          path: kue-reader/build/outputs/aar/kue-reader-release.aar
          retention-days: 7

      - name: Upload Sample APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
          retention-days: 7

  ci-gate:
    name: CI Gate
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Checks
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "CI Gate failed: Build & Test did not succeed."
            exit 1
          fi
          echo "All CI checks passed successfully!"
